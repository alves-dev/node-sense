[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodesense"
version = "0.3.0"
description = "Lightweight host telemetry agent for Home Assistant via MQTT"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "croniter>=2.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["nodesense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
