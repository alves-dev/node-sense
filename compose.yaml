name: nodesense-dev

services:
  nodesense:
    image: ${NODESENSE_IMAGE:-ghcr.io/alves-dev/nodesense:latest}
    build:
      context: .
      args: {TARGETARCH: amd64}
    container_name: nodesense-dev
    group_add:
      - "${DOCKER_GID:-999}"
    restart: unless-stopped
    ports:
      - "9131:9130"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENT_ID: ${AGENT_ID:-book4}
      AGENT_NAME: ${AGENT_NAME:-Book 4}
      MQTT_HOST: ${MQTT_HOST:-host.docker.internal}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-nodesense}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - nodesense-data:/data
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  nodesense-data:
